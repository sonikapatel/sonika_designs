<title>Mira Patient Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap">
<style>
/* Layout: one phone-sized app. On desktop it sits in a device frame beside a prototype panel; on phones it fills the screen. */
:root{
  /* Palette from the brief */
  --mist:#D5FFFF; --aqua:#B9F3F2; --cherry:#B21B1D; --snow:#FBFFFF; --sea:#83C3C4;

  --bg:#FBFFFF; --surface:#FFFFFF; --card:#DDF8F7; --card-2:#EAFDFD;
  --field:#F0FBFB; --field-focus:#FFFFFF; --line:#D3E9E9; --line-strong:#9CCBCC;
  --ink:#0F2526; --muted:#56706F; --faint:#86A0A0; --accent-ink:#2C7476;
  --brand:#B21B1D; --brand-tint:#FBEAEA;
  --cta-bg:#0F2526; --cta-ink:#FBFFFF;
  --select-bg:#D5FFFF; --select-line:#2C7476;
  --backdrop-a:#D5FFFF; --backdrop-b:#B9F3F2; --frame:#0F2526;
  --shadow:0 30px 80px -30px rgba(15,37,38,.35), 0 8px 24px -12px rgba(15,37,38,.18);
  --scrim:rgba(15,37,38,.32);
  /* Soft-depth layer: borderless porcelain cards on a tinted ground */
  --bg-top:#FBFFFF; --bg-bot:#ECF7F7;
  --shadow-card:0 1px 2px rgba(15,37,38,.05), 0 12px 30px -14px rgba(15,37,38,.22);
  --cta-top:#0F2526; --cta-bot:#3E5A5B; --cta-shadow:0 16px 30px -14px rgba(15,37,38,.55);
  --wheel-band:#E3F4F4; --badge-bg:#DDF6F5;

  --font:'Outfit', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1D1E; --surface:#112728; --card:#163A3B; --card-2:#12302F;
    --field:#14302F; --field-focus:#183837; --line:#21403F; --line-strong:#3B6667;
    --ink:#E6FBFB; --muted:#9FBFBF; --faint:#6E8F8F; --accent-ink:#8FD6D7;
    --brand:#E5524F; --brand-tint:#3A1C1C;
    --cta-bg:#D5FFFF; --cta-ink:#0B1D1E;
    --select-bg:#173F40; --select-line:#8FD6D7;
    --backdrop-a:#081617; --backdrop-b:#0F2A2B; --frame:#000000;
    --shadow:0 30px 80px -30px rgba(0,0,0,.7), 0 8px 24px -12px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.5);
    --bg-top:#0F2526; --bg-bot:#091A1B;
    --shadow-card:inset 0 1px 0 rgba(255,255,255,.05), 0 12px 30px -14px rgba(0,0,0,.7);
    --cta-top:#E6FFFF; --cta-bot:#A9E6E5; --cta-shadow:0 16px 30px -14px rgba(0,0,0,.7);
    --wheel-band:#1B3E3F; --badge-bg:#173B3C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1D1E; --surface:#112728; --card:#163A3B; --card-2:#12302F;
  --field:#14302F; --field-focus:#183837; --line:#21403F; --line-strong:#3B6667;
  --ink:#E6FBFB; --muted:#9FBFBF; --faint:#6E8F8F; --accent-ink:#8FD6D7;
  --brand:#E5524F; --brand-tint:#3A1C1C;
  --cta-bg:#D5FFFF; --cta-ink:#0B1D1E;
  --select-bg:#173F40; --select-line:#8FD6D7;
  --backdrop-a:#081617; --backdrop-b:#0F2A2B; --frame:#000000;
  --shadow:0 30px 80px -30px rgba(0,0,0,.7), 0 8px 24px -12px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.5);
  --bg-top:#0F2526; --bg-bot:#091A1B;
  --shadow-card:inset 0 1px 0 rgba(255,255,255,.05), 0 12px 30px -14px rgba(0,0,0,.7);
  --cta-top:#E6FFFF; --cta-bot:#A9E6E5; --cta-shadow:0 16px 30px -14px rgba(0,0,0,.7);
  --wheel-band:#1B3E3F; --badge-bg:#173B3C;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); color:var(--ink);
  background:radial-gradient(120% 90% at 20% 0%, var(--backdrop-a), var(--backdrop-b));
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}

/* ---------- Page layout ---------- */
.wrap{
  min-height:100%; display:grid; grid-template-columns:minmax(0,320px) auto; justify-content:center;
  align-items:center; gap:56px; padding-block:24px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.panel{display:flex;flex-direction:column;gap:22px;min-width:0}
.panel .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:500;letter-spacing:-.01em}
.panel h2{margin:0;font-weight:400;font-size:15px;line-height:1.5;color:var(--muted);text-wrap:pretty}
.panel-group{display:flex;flex-direction:column;gap:8px}
.panel-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.spec-switch{display:flex;flex-wrap:wrap;gap:6px}
.spec-switch button{font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);transition:background-color 150ms ease, transform 160ms var(--ease-out)}
.spec-switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.spec-switch button:active,.panel-actions button:active{transform:scale(.97)}
.panel-actions{display:flex;flex-wrap:wrap;gap:6px}
.panel-actions button{font-size:13px;padding:7px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);transition:transform 160ms var(--ease-out)}
.swatches{display:flex;gap:6px}
.swatches span{width:28px;height:28px;border-radius:8px;border:1px solid var(--line)}
.panel small{color:var(--muted);font-size:12px;line-height:1.5}

.device{
  width:390px; height:min(844px, calc(100vh - 48px)); border-radius:54px; padding:11px;
  background:var(--frame); box-shadow:var(--shadow); position:relative;
}
.app{
  position:relative; width:100%; height:100%; border-radius:44px; overflow:hidden;
  background:linear-gradient(to bottom, var(--bg-top), var(--bg-bot)); display:flex; flex-direction:column; isolation:isolate;
}
.statusbar{height:46px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 34px;font-size:15px;font-weight:600}
.statusbar svg{display:block}
.sb-icons{display:flex;gap:6px;align-items:center}

@media (max-width:1023px){ .panel{display:none} .wrap{grid-template-columns:auto} }
@media (max-width:520px){
  .wrap{display:block;padding:0;min-height:0;height:100%}
  .device{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  .app{border-radius:0}
  .statusbar{display:none}
}

/* ---------- App chrome ---------- */
.nav{flex:none;height:54px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 10px;border-bottom:1px solid transparent;transition:border-color 200ms ease}
.nav.ruled{border-bottom-color:var(--line)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;transition:transform 160ms var(--ease-out), opacity 200ms ease}
.icon-btn:active{transform:scale(.92)}
.icon-btn[aria-hidden="true"]{opacity:0;pointer-events:none}
.nav-title{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.sec-btn{display:flex;align-items:center;gap:4px;font-size:17px;font-weight:500;padding:4px 8px;border-radius:10px;transition:transform 160ms var(--ease-out)}
.sec-btn:active{transform:scale(.97)}
.sec-btn[disabled]{cursor:default}
.sec-btn[disabled] .chev{display:none}
.nav-sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.progress{flex:none;display:flex;gap:4px;padding:0 22px 8px;height:12px;transition:opacity 200ms ease}
.progress[data-off="true"]{opacity:0}
.seg-bar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.seg-bar i{display:block;height:100%;background:var(--brand);transform-origin:left;transform:scaleX(0);transition:transform 420ms var(--ease-out)}

.stage{position:relative;flex:1;min-height:0}
.screen{
  position:absolute; inset:0; overflow-y:auto; overscroll-behavior:contain;
  padding:18px 22px 150px; -webkit-overflow-scrolling:touch;
  transition:transform 280ms var(--ease-out), opacity 220ms var(--ease-out), filter 220ms ease;
}
.screen.pre{opacity:0;transform:translateX(calc(var(--dir,1) * 28px));filter:blur(2px)}
.screen.out{opacity:0;transform:translateX(calc(var(--dir,1) * -28px));filter:blur(2px);transition-duration:200ms;pointer-events:none}
.screen::-webkit-scrollbar{display:none}

.foot{
  position:absolute;left:0;right:0;bottom:0;z-index:5;
  padding:28px 20px calc(18px + env(safe-area-inset-bottom, 0px));
  background:linear-gradient(to top, var(--bg-bot) 62%, color-mix(in srgb, var(--bg-bot) 0%, transparent));
  display:flex;flex-direction:column;align-items:stretch;gap:6px;
}
.cta{
  height:60px;border-radius:999px;color:var(--cta-ink);
  background:linear-gradient(to bottom, var(--cta-top), var(--cta-bot));
  box-shadow:var(--cta-shadow), inset 0 1px 0 rgba(255,255,255,.14);
  font-size:18px;font-weight:500;letter-spacing:.005em;
  transition:transform 160ms var(--ease-out), opacity 200ms ease, box-shadow 200ms ease;
}
.cta:active{transform:scale(.97)}
.cta:disabled{opacity:.28;cursor:not-allowed;transform:none;box-shadow:none}
.link-btn{height:40px;font-size:15px;color:var(--accent-ink);font-weight:500;border-radius:12px;transition:transform 160ms var(--ease-out)}
.link-btn:active{transform:scale(.97)}

/* ---------- Typography in screens ---------- */
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:6px 0 10px}
.h1{font-size:32px;line-height:1.12;font-weight:600;letter-spacing:-.025em;margin:0 0 12px;text-wrap:balance}
.h1 em,.h-xl em{font-style:normal;color:var(--accent-ink)}
.sub{font-size:17px;line-height:1.45;color:var(--muted);margin:0 0 26px;text-wrap:pretty}
.h-xl{font-size:38px;line-height:1.08;font-weight:600;letter-spacing:-.03em;margin:0 0 14px;text-wrap:balance}

/* entrance stagger on first paint of a screen */
.rise{animation:rise 360ms var(--ease-out) both;animation-delay:calc(var(--i,0) * 35ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* ---------- Inputs ---------- */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:22px 12px}
.fwrap{grid-column:span 2;min-width:0}
.fwrap.half{grid-column:span 1}
.fwrap.reveal{animation:rise 260ms var(--ease-out) both}
.inp{position:relative}
/* static label row: label left, live context right */
.flabel{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 4px 9px;min-width:0}
.flabel label{font-size:15px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flabel .meta{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.flabel .meta.filled{color:var(--accent-ink)}
.inp input,.inp textarea{
  width:100%;height:62px;border-radius:22px;border:1.5px solid transparent;background:var(--surface);
  padding:0 20px;font-size:18px;outline:none;box-shadow:var(--shadow-card);
  transition:border-color 160ms ease, box-shadow 200ms ease;
}
.inp textarea{height:132px;resize:none;line-height:1.4;padding:16px 20px}
.inp input::placeholder,.inp textarea::placeholder{color:var(--faint);opacity:1}
.inp input:focus,.inp textarea:focus{border-color:var(--select-line);box-shadow:var(--shadow-card), 0 0 0 4px color-mix(in srgb, var(--sea) 25%, transparent)}
.inp.err input{border-color:var(--brand)}
.ferr{font-size:13px;color:var(--brand);margin:6px 4px 0}

/* wheel date picker */
.wheel{position:relative;display:grid;grid-template-columns:1.1fr .8fr 1.1fr;padding:0 10px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow-card)}
.wband{position:absolute;left:10px;right:10px;top:50%;height:44px;transform:translateY(-50%);border-radius:14px;background:var(--wheel-band);pointer-events:none}
.wcol{position:relative;z-index:1;height:220px;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(transparent, #000 32%, #000 68%, transparent);mask-image:linear-gradient(transparent, #000 32%, #000 68%, transparent);border-radius:14px}
.wcol::-webkit-scrollbar{display:none}
.wpad{height:88px}
.witem{height:44px;display:grid;place-items:center;scroll-snap-align:center;font-size:22px;color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer;user-select:none;will-change:transform,opacity}
.witem.on{color:var(--ink);font-weight:500}

/* section badge on question screens */
.qbadge{width:60px;height:60px;border-radius:50%;background:var(--badge-bg);color:var(--accent-ink);display:grid;place-items:center;margin:2px 0 18px}
.opt{font-size:12px;color:var(--faint);font-weight:400}

.seg-label{font-size:15px;font-weight:500;color:var(--muted);margin:0 4px 10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.pill{
  min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid transparent;background:var(--surface);box-shadow:var(--shadow-card);
  font-size:15px;transition:transform 160ms var(--ease-out), background-color 160ms ease, border-color 160ms ease;
}
.pill:active{transform:scale(.97)}
.pill.on{background:var(--select-bg);border-color:var(--select-line);color:var(--ink)}

.toggle-row{display:flex;align-items:center;justify-content:space-between;min-height:62px;padding:0 16px 0 20px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-card);font-size:17px}
.switch{width:51px;height:31px;border-radius:999px;background:var(--line-strong);position:relative;transition:background-color 200ms ease;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform 240ms var(--ease-out)}
.switch[aria-checked="true"]{background:var(--accent-ink)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

.stepper-row{display:flex;align-items:center;justify-content:space-between;min-height:62px;padding:0 10px 0 20px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-card)}
.stepper-row span{font-size:16px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:20px;line-height:1;transition:transform 160ms var(--ease-out)}
.stepper button:active{transform:scale(.92)}
.stepper output{min-width:28px;text-align:center;font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}

/* choice rows */
.options{display:flex;flex-direction:column;gap:10px}
.opt-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;
  min-height:62px;padding:14px 20px;border-radius:22px;border:1.5px solid transparent;background:var(--surface);box-shadow:var(--shadow-card);
  font-size:18px;transition:transform 160ms var(--ease-out), background-color 180ms ease, border-color 180ms ease;
}
.opt-row:active{transform:scale(.98)}
.opt-row .radio{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none;display:grid;place-items:center;transition:border-color 180ms ease, background-color 180ms ease}
.opt-row .radio svg{opacity:0;transform:scale(.6);transition:opacity 160ms ease, transform 200ms var(--ease-out)}
.opt-row.on{background:var(--select-bg);border-color:var(--select-line)}
.opt-row.on .radio{background:var(--accent-ink);border-color:var(--accent-ink)}
.opt-row.on .radio svg{opacity:1;transform:scale(1)}
.opt-row small{display:block;font-size:14px;color:var(--muted);margin-top:2px}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  min-height:46px;padding:0 16px;border-radius:999px;border:1.5px solid transparent;background:var(--surface);box-shadow:var(--shadow-card);
  font-size:16px;display:inline-flex;align-items:center;gap:8px;
  transition:transform 160ms var(--ease-out), background-color 160ms ease, border-color 160ms ease;
}
.chip:active{transform:scale(.97)}
.chip .ck{width:0;overflow:hidden;display:inline-grid;transition:width 200ms var(--ease-out)}
.chip.on{background:var(--select-bg);border-color:var(--select-line)}
.chip.on .ck{width:16px}
.chip.none{border-style:dashed;border-color:var(--line-strong);box-shadow:none;background:transparent}
.chip.none.on{background:var(--select-bg);border-color:var(--select-line);border-style:solid}

/* specialty tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{
  text-align:left;padding:16px 14px 14px;border-radius:20px;border:1.5px solid transparent;background:var(--surface);box-shadow:var(--shadow-card);
  display:flex;flex-direction:column;gap:10px;min-height:118px;
  transition:transform 160ms var(--ease-out), background-color 180ms ease, border-color 180ms ease;
}
.tile:active{transform:scale(.97)}
.tile .ic{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;color:var(--accent-ink)}
.tile b{font-weight:500;font-size:16px;display:block}
.tile span{font-size:13px;color:var(--muted);line-height:1.35}
.tile.on{background:var(--select-bg);border-color:var(--select-line)}

/* hero card (Hers-style) */
.hero-card{background:var(--card);border-radius:28px;padding:22px 22px 20px;margin:4px 0 14px}
.badge{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--aqua);color:#0F2526;font-size:14px;font-weight:500}
.hero-card h3{font-size:30px;font-weight:500;letter-spacing:-.015em;line-height:1.1;margin:16px 0 18px}
.plan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan-list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid color-mix(in srgb, var(--accent-ink) 18%, transparent);font-size:16px}
.plan-list li span:last-child{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.plan-foot{margin-top:14px;font-size:16px}
.fine{font-size:14px;line-height:1.45;color:var(--muted);margin:0}
.fine b{color:var(--ink);font-weight:600}

.appt{background:var(--card);border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;gap:4px;margin:6px 0 22px}
.appt .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:500}
.appt .v{font-size:20px;font-weight:500}
.appt .m{font-size:15px;color:var(--muted)}
.trust{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.trust li{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.35}
.trust li svg{flex:none;color:var(--accent-ink);margin-top:1px}
.trust li span small{display:block;color:var(--muted);font-size:14px}

.brand-mark{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:18px;letter-spacing:-.01em}
.brand-dot{width:26px;height:26px;border-radius:8px;background:var(--brand);display:grid;place-items:center}

/* scale */
.scale-wrap{background:var(--card-2);border-radius:24px;padding:22px 20px 18px}
.scale-num{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.scale-num b{font-size:64px;line-height:1;font-weight:400;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.scale-num span{font-size:18px;color:var(--muted)}
input[type=range].range{
  -webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0;
}
input[type=range].range::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(to right, var(--accent-ink) var(--p,0%), var(--line) var(--p,0%))}
input[type=range].range::-moz-range-track{height:8px;border-radius:8px;background:linear-gradient(to right, var(--accent-ink) var(--p,0%), var(--line) var(--p,0%))}
input[type=range].range::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:var(--surface);border:2px solid var(--accent-ink);margin-top:-12px;box-shadow:0 4px 12px rgba(15,37,38,.18);transition:transform 160ms var(--ease-out)}
input[type=range].range::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--surface);border:2px solid var(--accent-ink)}
input[type=range].range:active::-webkit-slider-thumb{transform:scale(1.1)}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}

/* list (medications) */
.add-row{display:flex;gap:8px}
.add-row .inp{flex:1}

/* review */
.rv{display:flex;flex-direction:column;gap:14px}

/* intro: health profile orbit */

/* sized to the shorter of the screen width and the space left above the button */
.orbit{position:relative;aspect-ratio:1;margin:6px 0 4px 50%;transform:translateX(-50%);

/* Intro choreography (first-run only, so it can carry some delight):

function initWheels(el) {
  el.querySelectorAll('.wheel').forEach(w => {
    const k = w.dataset.wheel;
    const cols = { m: w.querySelector('[data-wcol="m"]'), d: w.querySelector('[data-wcol="d"]'), y: w.querySelector('[data-wcol="y"]') };
    const d0 = parseDate(A[k]);
    const start = d0 ? { m: d0.getMonth(), d: d0.getDate() - 1, y: YEARS.indexOf(d0.getFullYear()) } : { m: 0, d: 0, y: YEARS.indexOf(1990) };
    const idx = c => Math.round(c.scrollTop / WH);
    const paint = c => {
      const at = c.scrollTop / WH;
      c.querySelectorAll('.witem').forEach((it, j) => {
        const dist = Math.abs(j - at);
        if (dist > 3.5) { if (it.style.opacity !== '0') it.style.opacity = 0; return; }
        it.style.opacity = Math.max(0.15, 1 - dist * 0.3);
        it.style.transform = `scale(${1 - Math.min(dist, 3) * 0.07})`;
        it.classList.toggle('on', dist < 0.5);
      });
    };
    let ready = false;
    const commit = () => {
      const m = idx(cols.m), y = YEARS[idx(cols.y)];
      let d = idx(cols.d);
      const max = new Date(y, m + 1, 0).getDate();
      if (d + 1 > max) { d = max - 1; cols.d.scrollTo({ top: d * WH, behavior: 'smooth' }); }
      A[k] = `${String(m + 1).padStart(2, '0')}/${String(d + 1).padStart(2, '0')}/${y}`;
      cols.m.setAttribute('aria-valuetext', MONTHS[m]); cols.d.setAttribute('aria-valuetext', d + 1); cols.y.setAttribute('aria-valuetext', y);
      save(); refresh();
    };
    Object.values(cols).forEach(c => {
      c.scrollTop = start[c.dataset.wcol] * WH; paint(c);
      let raf, t;
      c.addEventListener('scroll', () => {
        cancelAnimationFrame(raf); raf = requestAnimationFrame(() => paint(c));
        clearTimeout(t); if (ready) t = setTimeout(commit, 140);
      }, { passive: true });
      c.addEventListener('click', e => {
        const it = e.target.closest('.witem'); if (!it) return;
        if (idx(c) === +it.dataset.i) commit(); else c.scrollTo({ top: +it.dataset.i * WH, behavior: 'smooth' });

        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
        e.preventDefault(); c.scrollBy({ top: e.key === 'ArrowDown' ? WH : -WH, behavior: 'smooth' });
      });
    });
    setTimeout(() => { ready = true; }, 250);
  });
}

function summarize(q) {
  const v = k => A[k];
  switch (q.type) {
    case 'fields': return q.fields.filter(f => !f.showIf || f.showIf(A)).map(f => {
      const x = v(f.k);
      if (f.type === 'toggle') return x ? f.label : '';
      if (f.type === 'stepper') return `${f.label}: ${+x || 0}`;
      if (f.type === 'ssn' && x) return '•••-••-' + digits(x).slice(-4);
      return x ? String(x) : '';
    }).filter(Boolean).join(' · ');
    case 'choice': return v(q.k) || '';
    case 'multi': return (v(q.k) || []).join(', ');
    case 'scale': return v(q.k) === undefined ? '' : `${v(q.k)} of 10`;
    case 'list': return (v(q.k) || []).length ? v(q.k).join(', ') : (A[q.k + '_none'] ? 'None' : '');
    case 'yesno': return [v(q.k), ...(v(q.k) === 'Yes' ? (q.followUp || []).map(f => v(f.k)) : [])].filter(Boolean).join(' · ');
  }
  return '';
}

}

// Check-in code staff scan at the front desk. Derived from the patient's name and birthday so it stays the same on every visit.
function checkinCode() {
  const s = `${A.first || ''}${A.last || ''}${A.dob || ''}`.toLowerCase();
  let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 100000;
  return 'HH-' + String(h).padStart(5, '0');
}
// The QR encodes a check-in link (example.com domain: prototype only). Falls back to the typed code if the QR library didn't load.
function qrSVG(text) {
  if (!window.qrcode) return `<span class="qr-fallback">${esc(text.split('/').pop())}</span>`;
  const q = window.qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c},${r}h1v1h-1z`;
  return `<svg viewBox="-3 -3 ${n + 6} ${n + 6}" shape-rendering="crispEdges" role="img" aria-label="Check-in QR code"><rect x="-3" y="-3" width="${n + 6}" height="${n + 6}" fill="#fff"/><path d="${d}" fill="#0F2526"/></svg>`;
}
function doneHTML() {
  const name = [A.first, A.last].filter(Boolean).join(' ') || 'Patient';

const $ = id => document.getElementById(id);
const stage = $('stage'), cta = $('cta'), cta2 = $('cta2');
let current = null, lock = false;

function updateChrome(p) {
  const isQ = !!p.q, post = p.id === 'review' || p.id === 'sign';
  $('app').dataset.page = p.id;
  $('backBtn').setAttribute('aria-hidden', p.id === 'intro' || p.id === 'splash' || p.id === 'done' ? 'true' : 'false');
  $('closeBtn').setAttribute('aria-hidden', p.id === 'done' || p.id === 'intro' || p.id === 'splash' ? 'true' : 'false');
  $('secTitle').textContent = isQ ? p.sec.title : post ? (p.id === 'review' ? 'Review' : 'Sign') : p.id === 'done' ? 'Done' : p.id === 'intro' || p.id === 'splash' ? '' : p.id === 'welcome' ? 'Check-in' : 'Intake';
  $('secBtn').disabled = !(isQ || post);
  $('nav').classList.toggle('ruled', isQ || post);

  const secs = sections(), prog = $('progress');
  prog.dataset.off = String(!(isQ || post));
  if (prog.children.length !== secs.length) prog.innerHTML = secs.map(() => '<span class="seg-bar"><i></i></span>').join('');
  [...prog.children].forEach((b, i) => {
    let f = 0;
    if (post) f = 1; else if (isQ) f = i < p.si ? 1 : i === p.si ? Math.max(0.08, p.qi / p.sec.live.length) : 0;
    b.firstChild.style.transform = `scaleX(${f})`;
  });
  updateCTA(p);
}
function updateCTA(p = current) {

function initSig(el) {
  const c = el.querySelector('#sigCanvas'), wrap = el.querySelector('#sig');
  const fit = () => {
    const r = c.getBoundingClientRect(); if (!r.width) return;
    const dpr = window.devicePixelRatio || 1;
    c.width = r.width * dpr; c.height = r.height * dpr;
    const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 2.4;
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#0F2526';
    if (sigData) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height); img.src = sigData; }
  };
  setTimeout(fit, 30);
  let drawing = false, pid = null, pts = [];
  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.addEventListener('pointerdown', e => {
    if (drawing) return; // ignore extra fingers
    drawing = true; pid = e.pointerId; c.setPointerCapture(pid); pts = [pos(e)];
    const ctx = c.getContext('2d'); ctx.beginPath(); ctx.moveTo(...pts[0]);
    wrap.classList.add('has');
  });
  c.addEventListener('pointermove', e => {
    if (!drawing || e.pointerId !== pid) return;
    const p = pos(e); pts.push(p);
    const ctx = c.getContext('2d');
    if (pts.length > 2) { const a = pts[pts.length - 2]; const m = [(a[0] + p[0]) / 2, (a[1] + p[1]) / 2]; ctx.quadraticCurveTo(a[0], a[1], m[0], m[1]); ctx.stroke(); ctx.beginPath(); ctx.moveTo(...m); }
  });
  const end = e => { if (!drawing || e.pointerId !== pid) return; drawing = false; if (pts.length > 1) { sigData = c.toDataURL(); updateCTA(); } };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
}

function openSheet(html, bind) {

  const close = () => {

  grab.addEventListener('pointerdown', e => { if (y0 !== null) return; y0 = e.clientY; t0 = Date.now(); pid = e.pointerId; grab.setPointerCapture(pid); sh.style.transition = 'none'; });

}
